plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
}

group = 'dev.salmonllama'
version = '3.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Database & Migrations
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'

    // Object Storage
    implementation platform('software.amazon.awssdk:bom:2.56.0')
    implementation ('software.amazon.awssdk:s3') {
        // The Netty client is only for the async API we don't use
        exclude module: 'netty-nio-client'
    }

    // Discord Library (JDA 5)
    implementation ('net.dv8tion:JDA:5.1.0') {
        exclude module: 'opus-java'
    }

    // Legacy transition dependencies
    implementation 'com.github.Kaaz:ConfigurationBuilder:0.4'
    implementation 'org.javacord:javacord:3.8.0'
    implementation 'com.vdurmont:emoji-java:5.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.salmonllama.fsbot.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        // Print full stack traces in CI, where the HTML test report isn't kept
        exceptionFormat = 'full'
    }
}

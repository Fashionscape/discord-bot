services:
  bot:
    image: ${FSBOT_IMAGE:-ghcr.io/fashionscape/discord-bot:latest}
    container_name: fsbot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seaweed:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fsbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashionscape}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-fsbot}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-fsbot_change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-fsbot} -d ${POSTGRES_DB:-fashionscape}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweed:
    # Single-node SeaweedFS: `weed mini` (the image's default command) runs master, volume,
    # filer and the S3 gateway in one container. See docs/adr/0001-seaweedfs-object-storage.md.
    image: chrislusf/seaweedfs:4.48
    container_name: fsbot-seaweed
    restart: unless-stopped
    environment:
      # Creates the S3 admin identity. Without these SeaweedFS allows all anonymous requests.
      AWS_ACCESS_KEY_ID: ${SEAWEED_ACCESS_KEY:?set SEAWEED_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_SECRET_KEY:?set SEAWEED_SECRET_KEY in .env}
    volumes:
      - seaweed_data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    # Serves MEDIA_DOMAIN over HTTPS (automatic certificates) and proxies outfit images to
    # the SeaweedFS S3 gateway. See caddy/Caddyfile.
    image: caddy:2.10.2-alpine
    container_name: fsbot-caddy
    restart: unless-stopped
    environment:
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.fashionscape.app}
      SEAWEED_BUCKET: ${SEAWEED_BUCKET:-fashionscape-outfits}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      seaweed:
        condition: service_healthy

volumes:
  postgres_data:
  seaweed_data:
  caddy_data:
  caddy_config:

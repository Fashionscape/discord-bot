fsbot:
  discord:
    token: ${FSBOT_DISCORD_TOKEN:}
    owner-id: ${FSBOT_OWNER_ID:0}
    dev-guild-id: ${FSBOT_DEV_GUILD_ID:}
    home-guild-id: ${FSBOT_HOME_GUILD_ID:}
  seaweed:
    endpoint: ${SEAWEED_ENDPOINT:http://localhost:8333}
    access-key: ${SEAWEED_ACCESS_KEY:seaweedadmin}
    secret-key: ${SEAWEED_SECRET_KEY:seaweedadmin}
    bucket: ${SEAWEED_BUCKET:fashionscape-outfits}
    public-url: ${SEAWEED_PUBLIC_URL:https://media.fashionscape.app}

spring:
  application:
    name: fashionscape-bot
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fashionscape}
    username: ${SPRING_DATASOURCE_USERNAME:fsbot}
    password: ${SPRING_DATASOURCE_PASSWORD:fsbot}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FsbotHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}
